<!DOCTYPE html>
<html>
<head><title>あすけん | ログイン</title></head>
<body>
<div id="login">
  <h1>メールアドレスでログイン</h1>
  <div class="gbox696_body">
    <form method="post" accept-charset="utf-8" action="/login">
      <div style="display:none;">
        <input type="hidden" name="_csrfToken" value="test_csrf_token_abc123"/>
      </div>
      <input type="text" name="CustomerMember[email]" class="input_text"/>
      <input type="password" name="CustomerMember[passwd_plain]" class="input_text"/>
      <input type="hidden" name="CustomerMember[autologin]" value="0"/>
      <input type="checkbox" name="CustomerMember[autologin]" value="1"/>
      <input type="image" name="Submit[submit]" src="/img/member_mng/btn_login.gif" alt="ログイン"/>
    </form>
  </div>
</div>
